<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders | Aadil Designer Boutique</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:#fff;
}

/* HEADER */
header{
  background:#000;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:14px;
  border-bottom:2px solid #d4af37;
}
.menu-btn{
  font-size:26px;
  color:#d4af37;
  cursor:pointer;
}
header img{width:90px;}
header .title{width:100%;text-align:center;}
header h1{color:#d4af37;margin:4px 0;font-size:20px;}
header p{color:#ccc;margin:0;font-size:14px;}

/* DRAWER */
.drawer{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:#111;
  padding:20px;
  transition:.3s;
  z-index:1000;
}
.drawer.open{left:0;}
.drawer a{
  display:block;
  padding:14px 0;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  border-bottom:1px solid #333;
}
.drawer a:hover{color:#d4af37;}
.close-btn{
  text-align:right;
  font-size:22px;
  color:#d4af37;
  cursor:pointer;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  z-index:999;
}
.overlay.show{display:block;}

/* PRODUCTS */
.section{
  padding:20px;
}
.section h2{
  color:#d4af37;
  text-align:center;
}
.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.product{
  text-align:center;
}
.product img{
  width:100%;
  height:260px;
  object-fit:cover;
  border:2px solid #d4af37;
  border-radius:10px;
}
.order-btn{
  margin-top:8px;
  background:#d4af37;
  color:#000;
  padding:10px;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
}
@media(max-width:768px){
  .products{grid-template-columns:repeat(2,1fr);}
  .product img{height:200px;}
}

/* ORDER FORM */
#orderBox{
  display:none;
  max-width:420px;
  margin:30px auto;
  background:#1c1c1c;
  padding:25px;
  border-radius:15px;
}
#orderImg{
  width:100%;
  height:240px;
  object-fit:cover;
  border:2px solid #d4af37;
  border-radius:10px;
}
label{display:block;margin-top:14px;}
input,select,textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:8px;
  border:none;
}
textarea{resize:none;}
button{
  margin-top:20px;
  width:100%;
  padding:14px;
  background:#d4af37;
  color:#000;
  font-weight:bold;
  border:none;
  border-radius:30px;
}
.back{
  text-align:center;
  margin-top:15px;
}
.back a{
  color:#d4af37;
  text-decoration:none;
}

/* FOOTER */
footer{
  background:#000;
  text-align:center;
  padding:12px;
  color:#aaa;
}
</style>
</head>

<body>

<!-- DRAWER -->
<div class="drawer" id="drawer">
  <div class="close-btn" onclick="toggleMenu()">✖</div>
  <a href="index.html">Home</a>
  <a href="orders.html">Orders</a>
  <a href="location.html">Location</a>
  <a href="about.html">About Us</a>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- HEADER -->
<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <img src="logo.jpg">
  <div class="title">
    <h1>Aadil Designer Boutique</h1>
    <p>Elegance • Style • Perfection</p>
  </div>
</header>

<!-- PRODUCTS -->
<div class="section" id="productsSection">
<h2>Our Collection</h2>

<div class="products">

<div class="product">
<img src="img1.jpg">
<div class="order-btn" onclick="openOrder('Designer Suit','img1.jpg')">Order It</div>
</div>

<div class="product">
<img src="img2.jpg">
<div class="order-btn" onclick="openOrder('Bridal Lehenga','img2.jpg')">Order It</div>
</div>

<div class="product">
<img src="img3.jpg">
<div class="order-btn" onclick="openOrder('Party Wear Gown','img3.jpg')">Order It</div>
</div>

<div class="product">
<img src="img4.jpg">
<div class="order-btn" onclick="openOrder('Festive Kurti Set','img4.jpg')">Order It</div>
</div>

</div>
</div>

<!-- ORDER FORM -->
<div id="orderBox">
<h2 style="text-align:center;color:#d4af37;">Place Your Order</h2>

<img id="orderImg">
<p id="orderInfo" style="text-align:center;color:#ccc;"></p>

<form onsubmit="sendOrder();return false;">
<label>Name</label>
<input id="name" required>

<label>Phone</label>
<input id="phone" required>

<label>City</label>
<input id="city">

<label>Size</label>
<select id="size">
<option>S</option><option>M</option><option>L</option>
<option>XL</option><option>Custom</option>
</select>

<label>Color</label>
<select id="color">
<option>Red</option><option>Black</option>
<option>Blue</option><option>Custom</option>
</select>

<label>Note</label>
<textarea id="note"></textarea>

<button>Submit Order</button>
</form>

<div class="back">
<a href="#" onclick="goBack()">← Back to Products</a>
</div>
</div>

<footer>
© 2026 Aadil Designer Boutique
</footer>

<script>
let currentProduct="", orderId="";

function toggleMenu(){
  drawer.classList.toggle("open");
  overlay.classList.toggle("show");
}

function openOrder(product,img){
  orderId = "ADB" + Math.floor(100000 + Math.random()*900000);
  currentProduct = product;
  productsSection.style.display = "none";
  orderBox.style.display = "block";
  orderImg.src = img;
  orderInfo.innerText = "Order ID: " + orderId + " | Product: " + product;
  window.scrollTo(0,0);
}

function goBack(){
  orderBox.style.display = "none";
  productsSection.style.display = "block";
}

function sendOrder(){
  const msg =
`New Order
Order ID: ${orderId}
Product: ${currentProduct}
Name: ${name.value}
Phone: ${phone.value}
City: ${city.value}
Size: ${size.value}
Color: ${color.value}
Note: ${note.value}`;

  location.href =
  "https://wa.me/919815777137?text=" + encodeURIComponent(msg);
}
</script>

</body>
</html>
