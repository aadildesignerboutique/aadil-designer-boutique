<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aadil Designer Boutique</title>

<style>
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:white;
}

/* ===== HEADER ===== */
header{
  background:black;
  padding:15px;
  display:flex;
  align-items:center;
  gap:15px;
  border-bottom:2px solid #d4af37;
}
.menu-btn{
  font-size:26px;
  color:#d4af37;
  cursor:pointer;
}
header img{width:90px;}
header .title{
  text-align:center;
  width:100%;
}
header h1{
  color:#d4af37;
  margin:0;
  font-size:20px;
}
header p{
  color:#ccc;
  margin:0;
  font-size:14px;
}

/* ===== DRAWER (AMAZON STYLE) ===== */
.drawer{
  position:fixed;
  top:0;
  left:-280px;
  width:280px;
  height:100%;
  background:#111;
  transition:.3s;
  z-index:1000;
  overflow-y:auto;
}
.drawer.open{left:0;}

.drawer-header{
  display:flex;
  gap:12px;
  align-items:center;
  padding:18px;
  background:#000;
  border-bottom:1px solid #333;
}
.drawer-header img{
  width:55px;
  border-radius:6px;
}
.drawer-header h3{
  margin:0;
  color:#d4af37;
  font-size:16px;
}
.drawer-header p{
  margin:0;
  color:#aaa;
  font-size:12px;
}

.drawer a{
  display:block;
  padding:15px 20px;
  color:white;
  text-decoration:none;
  font-weight:bold;
  border-bottom:1px solid #222;
}
.drawer a:hover{
  background:#1a1a1a;
  color:#d4af37;
}

/* ===== OVERLAY ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  z-index:999;
}
.overlay.show{display:block;}

/* ===== BANNER ===== */
.slider img{
  width:100%;
  height:320px;
  object-fit:cover;
}
@media(max-width:768px){
  .slider img{height:220px;}
}

/* ===== SECTIONS ===== */
section{
  background:#1a1a1a;
  margin:15px;
  padding:20px;
  border-radius:10px;
}
h2{
  color:#d4af37;
  border-bottom:1px solid #333;
  padding-bottom:5px;
}

/* ===== PRODUCTS ===== */
.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.product img{
  width:100%;
  height:260px;
  object-fit:cover;
  border:2px solid #d4af37;
  border-radius:10px;
}
.order-btn{
  margin-top:8px;
  background:#d4af37;
  color:#000;
  padding:10px;
  border-radius:30px;
  font-weight:bold;
  text-align:center;
}
@media(max-width:768px){
  .products{grid-template-columns:repeat(2,1fr);}
  .product img{height:200px;}
}

/* ===== FLOATING SOCIAL ===== */
.float{
  position:fixed;
  right:15px;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  opacity:0;
  pointer-events:none;
  transition:.4s;
}
.float img{width:28px;}
.show{opacity:1;pointer-events:auto;}
.whatsapp{bottom:20px;background:#25D366;}
.instagram{bottom:90px;background:#E1306C;}
.pinterest{bottom:160px;background:#BD081C;}

/* ===== FOOTER ===== */
footer{
  background:black;
  text-align:center;
  padding:12px;
  font-size:14px;
  color:#aaa;
}
</style>
</head>

<body>

<!-- DRAWER -->
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <img src="logo.jpg">
    <div>
      <h3>Aadil Designer Boutique</h3>
      <p>Elegance • Style • Perfection</p>
    </div>
  </div>
  <a href="index.html">Home</a>
  <a href="orders.html">Orders</a>
  <a href="location.html">Location</a>
  <a href="about.html">About Us</a>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- HEADER -->
<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <img src="logo.jpg">
  <div class="title">
    <h1>Aadil Designer Boutique</h1>
    <p>Elegance • Style • Perfection</p>
  </div>
</header>

<!-- BANNER -->
<div class="slider">
  <img src="banner.jpg">
</div>

<!-- COLLECTION -->
<section>
<h2>Our Collection</h2>
<div class="products">
  <div class="product">
    <img src="img1.jpg">
    <div class="order-btn">Order It</div>
  </div>
  <div class="product">
    <img src="img2.jpg">
    <div class="order-btn">Order It</div>
  </div>
  <div class="product">
    <img src="img3.jpg">
    <div class="order-btn">Order It</div>
  </div>
</div>
</section>

<footer>
© 2026 Aadil Designer Boutique
</footer>

<!-- FLOATING ICONS -->
<a class="float whatsapp" href="https://wa.me/919815777137" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
</a>
<a class="float instagram" href="https://www.instagram.com/aadil.designer.boutique/" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
</a>
<a class="float pinterest" href="https://pin.it/1A3AOyESd" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/145/145808.png">
</a>

<script>
function toggleMenu(){
  drawer.classList.toggle("open");
  overlay.classList.toggle("show");
}

window.addEventListener("scroll",()=>{
  document.querySelectorAll(".float").forEach(i=>{
    window.scrollY>300 ? i.classList.add("show") : i.classList.remove("show");
  });
});
</script>

</body>
</html>
