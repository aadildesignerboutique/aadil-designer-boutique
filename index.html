<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aadil Designer Boutique</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:#fff;
}

/* HEADER */
header{
  text-align:center;
  background:#000;
  padding:20px;
  border-bottom:2px solid #d4af37;
}
header img{width:130px;}
h1{color:#d4af37;margin:10px 0 5px;}
header p{color:#ccc;}

/* BANNER */
.slider img{
  width:100%;
  height:300px;
  object-fit:cover;
}
@media(max-width:768px){
  .slider img{height:200px;}
}

/* SECTION */
section{
  background:#1a1a1a;
  margin:15px;
  padding:20px;
  border-radius:10px;
}
h2{
  color:#d4af37;
  border-bottom:1px solid #333;
  padding-bottom:5px;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.product{
  text-align:center;
}
.product img{
  width:100%;
  height:260px;
  object-fit:cover;
  border:2px solid #d4af37;
  border-radius:10px;
}
.product h3{
  color:#d4af37;
  margin:8px 0 0;
}

/* MOBILE: 2 PER ROW */
@media(max-width:768px){
  .products{grid-template-columns:repeat(2,1fr);}
  .product img{height:200px;}
}

/* FOOTER */
footer{
  background:#000;
  text-align:center;
  padding:12px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
<img src="logo.jpg">
<h1>Aadil Designer Boutique</h1>
<p>Elegance • Style • Perfection</p>
</header>

<div class="slider">
<img src="banner.jpg">
</div>

<section>
<h2>Our Collection</h2>

<div class="products">

<div class="product">
<a href="order.html?product=Designer Suit">
<img src="img1.jpg">
</a>
<h3>Designer Suit</h3>
</div>

<div class="product">
<a href="order.html?product=Bridal Lehenga">
<img src="img2.jpg">
</a>
<h3>Bridal Lehenga</h3>
</div>

<div class="product">
<a href="order.html?product=Party Wear Gown">
<img src="img3.jpg">
</a>
<h3>Party Wear Gown</h3>
</div>

<div class="product">
<a href="order.html?product=Festive Kurti Set">
<img src="img4.jpg">
</a>
<h3>Festive Kurti Set</h3>
</div>

</div>
</section>

<footer>
© 2026 Aadil Designer Boutique | Since 2005
</footer>

</body>
</html>
